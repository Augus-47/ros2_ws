/**:
  ros__parameters:
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    registration_method: "NDT_OMP"
    score_threshold: 1.5

    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_max_iterations: 35
    ndt_num_threads: 4
    transform_epsilon: 0.01

    voxel_leaf_size: 0.1

    scan_max_range: 60.0
    scan_min_range: 1.0
    scan_period: 0.1

    use_pcd_map: true
    map_path: "/home/nvidia/auto_driving/map.pcd"

    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0

    use_odom: true
    use_imu: false
    enable_debug: true

    reject_translation_threshold: 0.5
    reject_yaw_threshold_deg: 5.0
    reject_z_threshold: 0.3
    reject_roll_pitch_threshold_deg: 10.0
    
    localization_success_frame_num: 3
    init_score_threshold: 3.0

