bev_local_map_node:
  ros__parameters:
    cloud_topic: /points_filtered
    target_frame: base_link
    odom_frame: odom # 用来做时序位姿补偿

    publish_raw_topic: /bev/occupancy_raw
    publish_cost_topic: /bev/cost_grid

    tf_timeout_sec: 0.05

    # x_min/x_max/y_min/y_max：局部图范围
    x_min: -3.0
    x_max: 12.0
    y_min: -6.0
    y_max: 6.0
    resolution: 0.05  # BEV 分辨率

    # z_min/z_max：点云裁剪高度
    z_min: -0.30
    z_max: 1.50

    min_points_per_cell: 1

    flat_height_diff_thresh: 0.08
    flat_z_max_thresh: 0.15

    obstacle_height_diff_thresh: 0.12
    obstacle_z_max_thresh: 0.20

    unknown_occ_value: 25
    rough_occ_value: 40
    obstacle_occ_value: 100
    free_occ_value: 0

    # 给避障留安全边界
    inflate_radius: 0.05
    
    enable_temporal_fusion: true   # 开关
    fusion_frame_count: 4          # 最多融合几帧 
    fusion_time_window: 0.4        # 最多保留多长时间窗口 
    near_range_no_fusion: 2.5      # 近处不融合，防止拖影


