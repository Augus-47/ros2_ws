/partol_node:
  ros__parameters:
    use_sim_time: false
    use_fixed_initial_pose: false
    # wait_for_localization_stable: true
    wait_for_localization_stable: false
    initial_points: [0.0, 0.0, 0.0]
    # initial_points: [0.04554, 0.44537, -0.0489]
    
    # 旧巡检点（已注释）
    # target_points: [16.555, 14.058, 1.6374,
    #                 7.139, 40.326, 2.2753, -40.11, 43.465,
    #   -1.6657, -8.638, 0.263, -0.2915]

    
    # ⬇️ 4个巡航航点，顺序依次：x1,y1,yaw1, x2,y2,yaw2, x3,y3,yaw3, x4,y4,yaw4
    target_points: [
      1.96864, -11.10420, -2.7517,
      -8.25170, -12.30590, 1.8198,
      -8.32528, -0.96679, 0.2051,
      2.13575, -1.11844, -1.1683,
    ]
    
    # 巡检到达航点拍照后，图片保存的文件夹路径
    img_save_path: /tmp/partol_imgs/
    # 是否循环巡航
    loop_patrol: true
    # 位置到达容差，单位：米
    #小车当前位姿 和 目标航点的 `(x,y)` 距离 ≤ 0.366m，就判定【到达该点】，开始等待拍照流程
    arrive_tolerance: 0.366    # 0.366
    # 航向角到达容差，单位：弧度
    yaw_arrive_tolerance: 0.3  # 0.3
    # 判定到达目标点后，稳定等待多久再触发拍照,单位秒（在 settle 之后）
    photo_wait_sec: 0.5
    
    # 小车静置时间
    settle_before_photo_sec: 0.8
    # 到达航点的超时时间，单位秒
    photo_pose_match_timeout_sec: 1.5
    # 某个航点超时 / 抵达失败之后的策略
    # `true`：这个点失败，跳过，直接去下一个航点继续巡检（适合长期无人跑，不要卡死）
    # `false`：只要一个航点失败，整个巡检任务直接停止，不再往下跑
    continue_on_waypoint_failure: true
