scan_matcher:
    ros__parameters:
      registration_method: "NDT"
      ndt_resolution: 3.0  # 降低NDT网格分辨率，适应稀疏点云
      ndt_num_threads: 4
      trans_for_mapupdate: 1.5
      vg_size_for_input: 0.8  # 显著减小输入下采样力度（原2.5）
      vg_size_for_map: 0.1   # 调整地图下采样力度（原0.05）
      set_initial_pose: false
      use_imu: false
